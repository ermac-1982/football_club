# Render Blueprint: FastAPI + Streamlit
# Uses the Postgres database already created in this Render account.
# Dashboard: New > Blueprint > connect this repo
# https://dashboard.render.com/blueprints

services:
  - type: web
    name: football-club-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_ENV
        value: production
      # Internal connection string from the existing Render Postgres database.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: football-club-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: football-club-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: API_HOSTPORT
        fromService:
          name: football-club-api
          type: web
          property: hostport
      - key: API_PUBLIC_URL
        value: https://football-club-api.onrender.com
